name: Validate skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'examples/**'
      - 'templates/**'
      - 'scripts/**'
      - '.claude-plugin/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Check SKILL.md format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate installable skills
        run: node scripts/validate-skills.mjs

      - name: Validate examples
        run: node scripts/validate-skills.mjs examples

      - name: Validate template
        run: node scripts/validate-skills.mjs templates